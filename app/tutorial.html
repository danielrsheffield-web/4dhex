<!DOCTYPE html>
<html>
  <head>
    <title>Hex Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: system-ui, sans-serif;
}
.page {
  display: flex;
  height: 100vh;
  height: 100dvh;
}
.sidebar {
  width: 260px;           /* fixed sidebar width */
  flex-shrink: 0;         /* don't squish when board is wide */
  background: #565656;
  color: #eee;
  padding: 16px;
  overflow-y: auto;       /* scroll if menu is tall */
  border-right: 1px solid #333;
}
.main-content {
  flex: 1;                /* take remaining space */
  min-width: 0;
  min-height: 0;
  padding: clamp(8px, 2vw, 16px);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar h2 {
  margin-top: 0;
  font-size: 1.1rem;
}
.sidebar section {
  margin-bottom: 20px;
}
.sidebar label {
  display: block;
  margin-bottom: 4px;
}
.sidebar input[type="text"] {
  width: 100%;
  margin-bottom: 8px;
}
.sidebar button,
.sidebar input[type="submit"] {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  padding: 8px;
  cursor: pointer;
  white-space: nowrap;
}
#TurnDisplay {
    width: 100%;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 2px solid #222;
    color: #000;
    background-color: #0f72e2;
    white-space: nowrap;

}
.changeSlide {
  flex: 0 1 150px;
  min-width: 0;
  font-size: clamp(16px, 4vw, 24px);
  font-weight: bold;
  text-align: center;
  border-radius: 6px;
  border: 2px solid #222;
  color: #000;
  height: 40px;
  white-space: nowrap;
}
.slide-controls {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
#boardWrapper {
  position: relative;
  flex: 1;
  min-width: 0;
  min-height: 0;
}
#myCanvas {
  position: absolute;
  display: block;
  width: 100%;
  height: 100%;
}
#slideText {
    flex: 0 1 auto;
    min-height: 0;
    max-height: 28%;
    font-size: 16px;
    overflow-y: auto;
    border-radius: 6px;
    border: 2px solid #222;
    color: #000;
    background-color: #fff;
    padding: 10px;
}
@media (max-width: 700px) {
  .page {
    flex-direction: column;
  }
  .sidebar {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 0;
    padding: 8px;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid #333;
  }
  .sidebar button,
  .sidebar input[type="submit"],
  .sidebar div {
    flex: 0 0 auto;
    width: auto;
    margin: 0;
  }
  #TurnDisplay {
    width: auto;
    margin: 0;
    padding: 0 8px;
  }
  .sidebar br {
    display: none;
  }
}
    </style>
    <script>
      let gameId = null;
      
      async function init() {
      gameId = new URLSearchParams(window.location.search).get("game_id");
      if (gameId === null) {
        await getId();
      }
      coordOrder = JSON.parse(localStorage.getItem("coordOrder") || "[0,1,2,3]");
      marking = JSON.parse(localStorage.getItem("marking") || "false");
      curPlayer = 0;
      boardSize = 3
      hexSize = 50;
      centerX = 0;
      centerY = 0;
      checking = false;
      slide = 0;
      is2d = false;
      manCoords = false;
      victoryInt = 0;
      storedCells = [];
      slideRequest = 0;
    }

      async function getId() {
        const response = await fetch("/getId");
        const data = await response.json();
        gameId = data.user_id;
      }

      function resizeCanvas() {
        const canvas = document.getElementById("myCanvas");
        const wrapper = document.getElementById("boardWrapper");
        const width = Math.max(1, Math.floor(wrapper.clientWidth));
        const height = Math.max(1, Math.floor(wrapper.clientHeight));
        if (canvas.width !== width) canvas.width = width;
        if (canvas.height !== height) canvas.height = height;
        const boardWidth = is2d ? 20.25: 1.5 * boardSize * (boardSize + 1.5);
        const boardHeight = is2d ? 12.04: .86 * (boardSize + .5) * (boardSize + 1);
        hexSize = Math.min(Math.max(1, width - 32) / boardWidth, Math.max(1, height - 32) / boardHeight);
        centerX = width / 2;
        centerY = height / 2;
        localStorage.setItem("currentHex", "[]");
        redrawBoard();
      }

      function redrawBoard() {
        if (!storedCells.length) return;
        if (!is2d) {
          render4dHexGrid(storedCells);
          return;
        }
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "black";
        render2dHexGrid(storedCells[0][0], centerX, centerY, ctx, [1, 1, 1, -1]);
        renderMarkings(ctx);
        renderTriangles();
        renderEdges();
        if (victoryInt !== 0) victory(victoryInt);
      }

      async function displaySlide(slide){
        const requestId = ++slideRequest;
        localStorage.setItem("edges", "[]");
        localStorage.setItem("triangles", "[]");

        if (slide === 24){
          document.getElementById("nextButton").innerHTML = "End";
        }
        else if (slide === 0){
          document.getElementById("previousButton").style.display = "none";
        }
        else if (slide === 25){
            window.location.href = "/";
            return;
        }
        else {
          document.getElementById("previousButton").style.display = "inline";
          document.getElementById("nextButton").style.display = "inline";
          document.getElementById("nextButton").innerHTML = "Next";
        }
        
        const response = await fetch("/readTutorial", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: gameId, slide: slide, coordOrder: coordOrder }),
        });
        const data = await response.json();
        if (requestId !== slideRequest) return;

        document.getElementById("slideText").innerHTML = data.text;
        document.getElementById("slideText").style.display = "block";

        boardSize = data.size;
        is2d = data.is2d;
        victoryInt = data.victory;
        storedCells = data.board;
        localStorage.setItem("storedCells", JSON.stringify(storedCells));
        markedCoords = data.marked;
        localStorage.setItem("markedCoords", JSON.stringify(markedCoords));

        if(manCoords !== data.manCoords){
            toggleCoords();
        }

          resizeCanvas();

        if (data.changeOrder){
            await newOrder(data.coordShift);
            if (requestId !== slideRequest) return;
        }
        
        
        
        document.getElementById("player").innerHTML = data.player === 1 ? "Blue" : "Red";
        document.getElementById("TurnDisplay").style.backgroundColor = curPlayer === 1 ? "#0f72e2" : "#d20d0d";
        document.getElementById("sidebar").style.backgroundColor = curPlayer === 1 ? "#0f72e2" : "#d20d0d";
        //if (data.marking){clearMarking();}
        //for (let i = 0; i < data.marked.length; i++) {
        //    mark(data.marked[i]);
        //}
        
        if (data.btriangleShow){
          showTriangles(1);
        }
        if (data.rtriangleShow){
          showTriangles(-1);
        }
        console.log(String(data.btriangleShow) + " " + String(data.rtriangleShow));
        
        writeRenderCells();
      }

      function changeSlide(direction){
        slide += direction;
        displaySlide(slide);
      }

    
    function render2dHexGrid(cells, baseX, baseY, ctx, axes, coords = []) {

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < cells.length; i++) {
          for (let j = 0; j < cells[i].length; j++) {
            x = baseX + ((i - j) * hexSize * .75)
            y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
            newCoords = coords.concat(i, j);
            drawHex(x, y, cells[i][j], ctx, newCoords);
          }
        }


    }

    function findHex4d(mouseX, mouseY, ctxt){
        c = document.getElementById("myCanvas");
        ctx = c.getContext("2d");


      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
            baseX = centerX + (((i - j) * hexSize * .75) * (boardSize + 1.5))
            baseY = centerY + (((i + j) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
        ctx.beginPath();
        ctx.moveTo(baseX - (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX + (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.closePath();
          if (ctx.isPointInPath(mouseX, mouseY)) {
            coords = findHex2d(mouseX, mouseY, baseX, baseY, ctx);
            coords = [i, j].concat(coords);
            return coords;
          }
        }
      }
      return [];

    }

    function findHex2d(mouseX, mouseY, baseX, baseY, ctx){
    for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          x = baseX + ((i - j) * hexSize * .75)
          y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
        genHex(x, y, ctx);
          if (ctx.isPointInPath(mouseX, mouseY)) {
            return([i, j]);
          }
        }
      }
      return [];
    }

    function handleMouseDown(e){
      e.preventDefault();
      if (!storedCells.length) return;
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const mouseX = (e.clientX - rect.left) * canvas.width / rect.width;
      const mouseY = (e.clientY - rect.top) * canvas.height / rect.height;
      if (is2d){
        coords = findHex2d(mouseX, mouseY, centerX, centerY, ctx);
        if (coords.length === 0) {return;}
        newCoords = [0, 0, coords[0], coords[1]];
        playAt(newCoords);
        return;
      }
      else {
        coords = findHex4d(mouseX, mouseY, ctx);
        if (coords.length === 0) {return;}
        storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
        if (e.which !== 3){playAt(coords);}
        else {mark(coords);}
      }
    }

    function handleContextMenu(e){
      e.preventDefault();
    }

    function handleMouseMove(e){
        e.preventDefault();
        if (!storedCells.length || is2d) return;

        currentHex = JSON.parse(localStorage.getItem("currentHex") || "[]");

        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) * canvas.width / rect.width;
        const mouseY = (e.clientY - rect.top) * canvas.height / rect.height;


        if (currentHex.length !== 0){
            center = Center(currentHex);
            x = center.x;
            y = center.y;
            genHex(x, y, ctx);
            if (ctx.isPointInPath(mouseX, mouseY)){
                return;
            }
        }
        
            coords = findHex4d(mouseX, mouseY, ctx);
            storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
            if (!is2d){
              render4dHexGrid(storedCells, false);
            }
            else {
              render2dHexGrid(storedCells[0][0], centerX, centerY, ctx, [1, 1, 1, -1]);
            }
            currentHex = coords;
            localStorage.setItem("currentHex", JSON.stringify(currentHex));
            if (coords.length === 0) {renderEdges();
                renderTriangles();
                return;}
            
            renderAdj(currentHex, true);
            renderEdges();
            renderTriangles();
            return;

    }

    // listen for mousedown events
    document.addEventListener("DOMContentLoaded", async () => {
        await init();
        localStorage.setItem("markedCoords", "[]");
        localStorage.setItem("currentHex", "[]");
        document.getElementById("player").innerHTML = "Blue";
        curPlayer = 1;
        localStorage.setItem("curPlayer", curPlayer);
        const sidebar = document.querySelector(".sidebar");
        sidebar.style.setProperty("background-color", "#0f72e2");
        slide = 0;
        new ResizeObserver(resizeCanvas).observe(document.getElementById("boardWrapper"));
        await displaySlide(slide);
        document.getElementById("myCanvas").addEventListener("mousedown", handleMouseDown);
        document.getElementById("myCanvas").addEventListener("mousemove", handleMouseMove);
        document.getElementById("myCanvas").addEventListener("contextmenu", handleContextMenu);
    });


      function genHex(x, y, ctx) {
        ctx.beginPath();
        ctx.moveTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 2), y);
        ctx.lineTo(x + (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 2), y);
        ctx.lineTo(x - (hexSize / 4), y - (hexSize * .43));
        ctx.closePath();
      }



      function drawHex(x, y, player, ctx, coords = []) {
        genHex(x, y, ctx);
        ctx.fillStyle = player === 1 ? "blue" : (player === -1 ? "red" : "#e8e8e8");
        ctx.fill();
        ctx.stroke();
            if (manCoords){
                writeCoords(coords, x, y, ctx);
            }
    }

      function render4dHexGrid(cells, incOthers = true) {
        if (!cells){return;}
        if (is2d){return;}
        if (curPlayer === -JSON.parse(localStorage.getItem("curPlayer") || "0")){
          curPlayer = -curPlayer;
          if (curPlayer === 1){
            document.getElementById("player").innerHTML = "Blue";
            document.getElementById("TurnDisplay").style.backgroundColor = "#0f72e2";
            document.getElementById("sidebar").style.backgroundColor = "#0f72e2";
          }
          else {
            document.getElementById("player").innerHTML = "Red";
            document.getElementById("TurnDisplay").style.backgroundColor = "#d20d0d";
            document.getElementById("sidebar").style.backgroundColor = "#d20d0d";
          }
        }
        localStorage.setItem("storedCells", JSON.stringify(cells));
        storedCells = cells;
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.strokeStyle = "black";

        axes = [0, 0, 0, 0];
        for (let i = 0; i < coordOrder.length; i++) {
            if (coordOrder[i] === 0 || coordOrder[i] === 2) {
                axes[i] = 1;
            }
            else {
                axes[i] = -1;
            }
        }

        ctx.clearRect(0, 0, c.width, c.height);

        centerX = c.width / 2;
        centerY = c.height / 2;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((boardSize + 1) * hexSize * .75), centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((boardSize + 1) * hexSize * .75), centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((boardSize + 1) * hexSize * .75), centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((boardSize + 1) * hexSize * .75), centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < cells.length; i++) {
          for (let j = 0; j < cells[i].length; j++) {
            x = centerX + (((i - j) * hexSize * .75) * (boardSize + 1.5))
            y = centerY + (((i + j) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
            render2dHexGrid(cells[i][j], x, y, ctx, axes, [i, j]);
          }
        }

        renderMarkings(ctx);
        if (incOthers){
          renderTriangles();
          renderEdges();
        }
        if (victoryInt !== 0) {
          victory(victoryInt);
        }
    }

      function renderMarkings(ctx) {
        markedCoords = JSON.parse(localStorage.getItem("markedCoords") || "[]");
        markedCoords.forEach(coord => {
          center = Center(coord);
          if (storedCells[coord[0]][coord[1]][coord[2]][coord[3]] !== 0){
            ctx.beginPath();
            ctx.arc(center.x, center.y, hexSize / 4, 0, 2 * Math.PI);
            ctx.fillStyle = "yellow";
            ctx.fill();
            if (manCoords){
              writeCoords(coord, center.x, center.y, ctx);
            }
          }
          else {
            genHex(center.x, center.y, ctx);
            ctx.fillStyle = "yellow";
            ctx.fill();
            ctx.stroke();
            if (manCoords){
              writeCoords(coord, center.x, center.y, ctx);
            }
          }  
        });
      }

      async function playAt(coords) {
        if (marking){
          mark(coords);
          return;
        }

        storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
        localStorage.setItem("triangles", JSON.stringify([]));
        localStorage.setItem("edges", JSON.stringify([]));
        
        if (storedCells[coords[0]][coords[1]][coords[2]][coords[3]] !== 0){
          return;
        }

        const response = await fetch("/play4d", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: gameId, coordOrder: coordOrder }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        storedCells = data.cells;
        victoryInt = data.victory;
        if (is2d){
          localStorage.setItem("storedCells", JSON.stringify(data.cells));
          redrawBoard();
        }
        else {
          render4dHexGrid(data.cells);
        }
        if (data.player === 1){
          curPlayer = 1;
          document.getElementById("player").innerHTML = "Blue";
          document.getElementById("TurnDisplay").style.backgroundColor = "#0f72e2";
          document.getElementById("sidebar").style.backgroundColor = "#0f72e2";
        }
        else{
          curPlayer = -1;
          document.getElementById("player").innerHTML = "Red";
          document.getElementById("TurnDisplay").style.backgroundColor = "#d20d0d";
          document.getElementById("sidebar").style.backgroundColor = "#d20d0d";
        }

        writeRenderCells();
      }

      function Center(coords){
        if (is2d){
            subCenterX = centerX; 
            subCenterY = centerY;
        }
        else {
            subCenterX = centerX + (((coords[0] - coords[1]) * hexSize * .75) * (boardSize + 1.5))
            subCenterY = centerY + (((coords[0] + coords[1]) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
        }
        x = subCenterX + ((coords[2] - coords[3]) * hexSize * .75)
        y = subCenterY + ((coords[2] + coords[3]) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
        return {
          x: x,
          y: y,
        }
      }
      
    async function showEdges(player) {
        clearEdges();
        const response = await fetch("/getEdges", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: gameId, coordOrder: coordOrder, player: player }),
        });
        if (!response.ok) {
          document.getElementById("error").innerHTML = "Server error: " + response.status;
          return;
        }
        c = document.getElementById("myCanvas");
        ctx = c.getContext("2d");


        const data = await response.json();
        localStorage.setItem("edges", JSON.stringify(data.edges));
        renderEdges();
      }

      function renderEdges() {
        ctx = document.getElementById("myCanvas").getContext("2d");
        edges = JSON.parse(localStorage.getItem("edges") || "[]");
        edges.forEach(edge => {
          center1 = Center(edge[0]);
          center2 = Center(edge[1]);
          ctx.beginPath();
          ctx.moveTo(center1.x, center1.y);
          ctx.lineTo(center2.x, center2.y);
          ctx.stroke();
        })
      }

      async function showTriangles(player) {
        clearEdges();
        const response = await fetch("/getTriangles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: gameId, coordOrder: coordOrder, player: player }),
        });
        if (!response.ok) {
          document.getElementById("error").innerHTML = "Server error: " + response.status;
          return;
        }
        const data = await response.json();
        localStorage.setItem("triangles", JSON.stringify(data.triangles));
        renderTriangles();
      }

      function renderTriangles() {
        ctx = document.getElementById("myCanvas").getContext("2d");
        triangles = JSON.parse(localStorage.getItem("triangles") || "[]");
        triangles.forEach(triangle => {
          center1 = Center(triangle[0]);
          center2 = Center(triangle[1]);
          center3 = Center(triangle[2]);
          ctx.beginPath();
          ctx.moveTo(center1.x, center1.y);
          ctx.lineTo(center2.x, center2.y);
          ctx.lineTo(center3.x, center3.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
          ctx.fill();
          ctx.strokeStyle = '#000000';
          ctx.stroke();
        })
      }

      function clearEdges() {
        localStorage.setItem("edges", JSON.stringify([]));
        localStorage.setItem("triangles", JSON.stringify([]));
        storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
        redrawBoard();
      }

      function adjInit(coords) {
        pos = adjBuild(coords, 0, 1);
        neg = adjBuild(coords, 0, -1);
        return pos.concat(neg);
      }

      function adjBuild(coords, start, sign) {
        if (start === 4){
            return [coords];
        }
        let unmod = adjBuild(coords, start + 1, sign);
        let newCoords = [0,0,0,0]
        for (let i = 0; i < coords.length; i++){
            if (i !== start){
                newCoords[i] = coords[i];
            }
            else {
                newCoords[i] = coords[i] + sign;
            }
        }
        if (newCoords[start] < 0 || newCoords[start] >= boardSize){
          return unmod;
        }
        let mod = adjBuild(newCoords, start + 1, sign);
        return unmod.concat(mod);
      }

      async function renderAdj(coords, add) {
        if (is2d || coords.length !== 4){
          return;
        }
        coordOrder = JSON.parse(localStorage.getItem("coordOrder") || "[0,1,2,3]");
        adj = adjInit(coords);

        let c = document.getElementById("myCanvas");
        let ctx = c.getContext("2d");

        if (!add) {
            let storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
        }
        for (let i = 0; i < adj.length; i++) {
            let center = Center(adj[i]);
            ctx.beginPath();
            ctx.arc(center.x, center.y, hexSize / 4, 0, 2 * Math.PI);
            if (add) {

                ctx.fillStyle = player === 1 ? '#b1d2f9' : (player === -1 ? '#f9b8b1' : (curPlayer === 1 ? '#b1d2f9' : '#f9b8b1'));
                ctx.fill();
                if(manCoords){
                    writeCoords(adj[i], center.x, center.y, ctx);
              }
            }
            else {
              playerHere = storedCells[adj[i][0]][adj[i][1]][adj[i][2]][adj[i][3]];
              if (playerHere === 0) {ctx.fillStyle = 'e8e8e8';}
              else {ctx.fillStyle = playerHere === 1 ? "blue" : playerHere === -1;}
              ctx.fill();
              if(manCoords){
                writeCoords(adj[i], center.x, center.y, ctx);
              }
            }
        }
      }


async function changeAxis(i, m){
    localStorage.setItem("edges", JSON.stringify([]));
    localStorage.setItem("triangles", JSON.stringify([]));

    dummy = coordOrder[m];
    coordOrder[m] = coordOrder[i];
    coordOrder[i] = dummy;

    markedCoords.forEach(coord => {
      dummy = coord[m];
      coord[m] = coord[i];
      coord[i] = dummy;

async function newOrder(choice){
    
    if (choice === 1){
        nextOrder = [0,2,1,3];
        document.getElementById("axisButton1").style.backgroundColor = "#ccc";
        document.getElementById("axisButton2").style.backgroundColor = "#eee";
        document.getElementById("axisButton3").style.backgroundColor = "#eee";
    }
    else if (choice === 2){
        nextOrder = [1,3,0,2];
        document.getElementById("axisButton1").style.backgroundColor = "#eee";
        document.getElementById("axisButton2").style.backgroundColor = "#ccc";
        document.getElementById("axisButton3").style.backgroundColor = "#eee";
    }
    else if (choice === 3){
        nextOrder = [0,1,2,3];
        document.getElementById("axisButton1").style.backgroundColor = "#eee";
        document.getElementById("axisButton2").style.backgroundColor = "#eee";
        document.getElementById("axisButton3").style.backgroundColor = "#ccc";
    } 


    localStorage.setItem("edges", JSON.stringify([]));
    localStorage.setItem("triangles", JSON.stringify([]));
    oldOrder = coordOrder;
    coordOrder = nextOrder;
    localStorage.setItem("coordOrder", JSON.stringify(coordOrder));
    const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: gameId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();

    newMarkedCoords = [];
    for (let i = 0; i < markedCoords.length; i++) {
        newMarkedCoords.push([0,0,0,0]);
      for (let j = 0; j < 4; j++) {
        oldPos = oldOrder.indexOf(coordOrder[j]);
        newMarkedCoords[i][j] = markedCoords[i][oldPos];
      }
    }
    markedCoords = newMarkedCoords;
    localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
    storedCells = data.board;
    localStorage.setItem("storedCells", JSON.stringify(storedCells));
    redrawBoard();
}

function victory(player){
  c = document.getElementById("myCanvas");
  ctx = c.getContext("2d");
  const bannerScale = Math.min(1, c.width / 400, c.height / 140);
  const bannerWidth = 400 * bannerScale;
  const bannerHeight = 70 * bannerScale;
  ctx.fillStyle = player === 1 ? "blue" : "red";
  ctx.fillRect(0, 0, bannerWidth, bannerHeight);
  ctx.font = `${50 * bannerScale}px Arial`;
  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (player === 1){
    ctx.fillText("Blue has won!", bannerWidth / 2, bannerHeight / 2);
  }
  else {
    ctx.fillText("Red has won!", bannerWidth / 2, bannerHeight / 2);
  }
}

function writeCoords(coords, x, y, ctx){
  ctx.fillStyle = "black";
  ctx.font = `${Math.min(12, hexSize * (is2d ? .22 : .16))}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (is2d){
    newCoords = coords.slice(-2).map(coord => 3 - coord);
    ctx.fillText(newCoords.join(","), x, y);
    return;
  }
  newCoords = [0, 0, 0, 0]
  canonOrder = [0, 2, 1, 3]
  for (let i = 0; i < coords.length; i++) {
    newCoords[canonOrder[coordOrder[i]]] = 3 - coords[i];
  }
  ctx.fillText(newCoords.join(","), x, y);
}

function fourdView() {
  window.open("/4dview" + "?game_id=" + gameId + "&player=" + 0 + "&botResponse=" + false, "_blank");
}

function writeRenderCells(){
        const size = storedCells.length;
        let renderCells = Array.from({ length: size }, () =>
          Array.from({ length: size }, () =>
            Array.from({ length: size }, () => Array(size).fill(0))
          )
        );
        let renderOrder = [0,0,0,0];
        renderOrder[3] = JSON.parse(localStorage.getItem("timeCoord") || "0");
        if (renderOrder[3] === 0 || renderOrder[3] === 2){
          renderOrder[0] = 2 - renderOrder[3];
          renderOrder[1] = 1;
          renderOrder[2] = 3;
        }
        else {
          renderOrder[0] = 4 - renderOrder[3];
          renderOrder[1] = 0;
          renderOrder[2] = 2;
        }
        const lastIndex = storedCells.length - 1;
        for (let i = 0; i < storedCells.length; i++) {
          for (let j = 0; j < storedCells[i].length; j++) {
            for (let k = 0; k < storedCells[i][j].length; k++) {
              for (let l = 0; l < storedCells[i][j][k].length; l++) {
                let subCoords = [i,j,k,l];
                copyCell = storedCells[lastIndex - subCoords[coordOrder[0]]][lastIndex - subCoords[coordOrder[1]]][lastIndex - subCoords[coordOrder[2]]][lastIndex - subCoords[coordOrder[3]]];
                if (copyCell === 0){
                  renderCells[subCoords[renderOrder[0]]][subCoords[renderOrder[1]]][subCoords[renderOrder[2]]][subCoords[renderOrder[3]]] = 3;
                }
                else if (copyCell === 1){
                  renderCells[subCoords[renderOrder[0]]][subCoords[renderOrder[1]]][subCoords[renderOrder[2]]][subCoords[renderOrder[3]]] = 0;
                }
                else if (copyCell === -1){
                  renderCells[subCoords[renderOrder[0]]][subCoords[renderOrder[1]]][subCoords[renderOrder[2]]][subCoords[renderOrder[3]]] = 1;
                }
              }
            }
          }
        }
        markedCoords.forEach(coord => {
          let objectiveCoords = [0,0,0,0];
          for (let i = 0; i < objectiveCoords.length; i++) {
            objectiveCoords[coordOrder[i]] = lastIndex - coord[i];
          }
          if (renderCells[objectiveCoords[renderOrder[0]]][objectiveCoords[renderOrder[1]]][objectiveCoords[renderOrder[2]]][objectiveCoords[renderOrder[3]]] === 3){
            renderCells[objectiveCoords[renderOrder[0]]][objectiveCoords[renderOrder[1]]][objectiveCoords[renderOrder[2]]][objectiveCoords[renderOrder[3]]] = 2;
          }
        });
        localStorage.setItem("renderCells", JSON.stringify(renderCells));
        localStorage.setItem("needUpdate", "true");
        localStorage.setItem("timeCoord", renderOrder[3]);
      }

      async function mark(coords){
        for (let i = 0; i < markedCoords.length; i++) {
            if (markedCoords[i][0] === coords[0] && markedCoords[i][1] === coords[1] && markedCoords[i][2] === coords[2] && markedCoords[i][3] === coords[3]) {
              markedCoords.splice(i, 1);
              localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
              const response = await fetch("/getBoard4d", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: gameId, coordOrder: coordOrder}),
              });
            if (!response.ok) {
            document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
            return;
            }
            const data = await response.json();
            render4dHexGrid(data.board);
            writeRenderCells();
            return;
          }
        }
        markedCoords.push(coords);
        localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
        const response = await fetch("/getBoard4d", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: gameId, coordOrder: coordOrder}),
              });
            if (!response.ok) {
            document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
            return;
            }
            const data = await response.json();
            render4dHexGrid(data.board);
            writeRenderCells();
            return;
          }
    </script>
