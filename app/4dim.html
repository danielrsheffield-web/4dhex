<!DOCTYPE html>
<html>
  <head>
    <title>Hex Game</title>
    <style>
        * {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: system-ui, sans-serif;
}
.page {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 260px;           /* fixed sidebar width */
  flex-shrink: 0;         /* don't squish when board is wide */
  background: #565656;
  color: #eee;
  padding: 16px;
  overflow-y: auto;       /* scroll if menu is tall */
  border-right: 1px solid #333;
}
.main-content {
  flex: 1;                /* take remaining space */
  padding: 16px;
  overflow: auto;         /* scroll board area if needed */
}
.sidebar h2 {
  margin-top: 0;
  font-size: 1.1rem;
}
.sidebar section {
  margin-bottom: 20px;
}
.sidebar label {
  display: block;
  margin-bottom: 4px;
}
.sidebar input[type="text"] {
  width: 100%;
  margin-bottom: 8px;
}
.sidebar button,
.sidebar input[type="submit"] {
  display: block;
  width: 100%;
  margin-bottom: 8px;
  padding: 8px;
  cursor: pointer;
}

      :root {
        --hex-size: 45px;
        --board-hex-size: 4;
        --stagger: 200px;
        }

      .hex-grid-container {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin: 4px 0;
      }

      .hex-grid-row{
        display: flex;
        gap: -20px;
      }

      .hex-grid {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin: 10px 0;
      }
      .hex-row {
        display: flex;
        gap: 1px;
      }


      .hex-row + .hex-row {
          margin-top: -10px;   /* pull this row up — tune number */
    }

    .hex-grid-row + .hex-grid-row {
        margin-top: 11px
    }

      .hex-btn {
        width: var(--hex-size);
        height: calc(var(--hex-size) * .9333);
        clip-path: polygon(75% 0%, 25% 0%, 0% 50%, 25% 100%, 75% 100%, 100% 50%);
        border: none;
        cursor: pointer;
        font-size: 24px;
        font-weight: bold;
        color: #333;
      }

      .hex-btn:disabled {
        cursor: default;
      }
      .player-0 {
        background-color: #e0e0e0;
      }
      .player-1 {
        background-color: #0f72e2;
        color: white;
      }
      .player--1 {
        background-color: #d20d0d;
        color: white;
      }
      .marked{
        background-color: #f6ed01;
        color: #f6ed01
      }
      .hex-btn.highlight-1 {
        background-color: #b1d2f9;
    }
    .hex-btn.highlight--1 {
        background-color: #f9b8b1;
    }
    .hex-btn.textlight-1 {
        color: #0f72e2;
    }
    .hex-btn.textlight--1 {
        color: #d20d0d;
    }
    .hex-btn.text-marked {
        color: #f6ed01;
    }
    </style>
    <script>
      let userId = localStorage.getItem("userId");
      let coordOrder = JSON.parse(localStorage.getItem("coordOrder") || "[0,1,2,3]");
      let markedCoords = JSON.parse(localStorage.getItem("markedCoords") || "[]");
      let marking = JSON.parse(localStorage.getItem("marking") || "false");
      let gameOver = false;
      let storedCells = [];
      let localPlayer = 0;
      let boardSize = 0;
      let hexSize = 50;
      let centerX = 0;
      let centerY = 0;
      let currentHex = [];

    
    function render2dHexGrid(cells, baseX, baseY, ctx, axes) {

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < cells.length; i++) {
          for (let j = 0; j < cells[i].length; j++) {
            x = baseX + ((i - j) * hexSize * .75)
            y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
            drawHex(x, y, cells[i][j], ctx);
          }
        }


    }

    function findHex4d(mouseX, mouseY, ctxt){
        c = document.getElementById("myCanvas");
        ctx = c.getContext("2d");


      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
            baseX = centerX + (((i - j) * hexSize * .75) * (boardSize + 1.5))
            baseY = centerY + (((i + j) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
        ctx.beginPath();
        ctx.moveTo(baseX - (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX + (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.closePath();
          if (ctx.isPointInPath(mouseX, mouseY)) {
            return findHex2d(mouseX, mouseY, baseX, baseY, i, j, ctx);
          }
        }
      }
      

    }

    function findHex2d(mouseX, mouseY, baseX, baseY, a, b, ctx){
        for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          x = baseX + ((i - j) * hexSize * .75)
          y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
        genHex(x, y, ctx);
          if (ctx.isPointInPath(mouseX, mouseY)) {
            return([a, b, i, j]);
          }
        }
      }

    }

    function handleMouseDown(e){
      e.preventDefault();
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      coords = findHex4d(mouseX, mouseY, ctx);
      playAt(coords);
    }

    function handleMouseMove(e){
      e.preventDefault();
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      if (currentHex.length === 0) {
        currentHex = findHex4d(mouseX, mouseY, ctx);
        renderAdj(currentHex, localStorage.getItem("userId"));
        return;
      }
      center = center(currentHex);
      genHex(center.x, center.y, ctx);
    if (!ctx.isPointInPath(mouseX, mouseY)) {
      currentHex = findHex4d(mouseX, mouseY, ctx);
      renderAdj({coords: currentHex, user_id: localStorage.getItem("userId")});
      return;
    }
    }

    // listen for mousedown events
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("myCanvas").addEventListener("mousedown", handleMouseDown);
        document.getElementById("myCanvas").addEventListener("mousemove", handleMouseMove);
    });



      function genHex(x, y, ctx) {
        ctx.beginPath();
        ctx.moveTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 2), y);
        ctx.lineTo(x + (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 2), y);
        ctx.lineTo(x - (hexSize / 4), y - (hexSize * .43));
        ctx.closePath();
      }



      function drawHex(x, y, player, ctx) {
        genHex(x, y, ctx);
        ctx.fillStyle = player === 1 ? "blue" : (player === -1 ? "red" : "#e8e8e8");
        ctx.fill();
        ctx.stroke();
      }

      function render4dHexGrid(cells) {
        storedCells = cells;
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.strokeStyle = "black";

        axes = [0, 0, 0, 0];
        for (let i = 0; i < coordOrder.length; i++) {
            if (coordOrder[i] === 0 || coordOrder[i] === 2) {
                axes[i] = 1;
            }
            else {
                axes[i] = -1;
            }
        }

        ctx.clearRect(0, 0, c.width, c.height);

        centerX = c.width / 2;
        centerY = c.height / 2;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((boardSize + 1) * hexSize * .75), centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((boardSize + 1) * hexSize * .75), centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((boardSize + 1) * hexSize * .75), centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((boardSize + 1) * hexSize * .75), centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < cells.length; i++) {
          for (let j = 0; j < cells[i].length; j++) {
            x = centerX + (((i - j) * hexSize * .75) * (boardSize + 1.5))
            y = centerY + (((i + j) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
            render2dHexGrid(cells[i][j], x, y, ctx, axes);
          }
        }
        
        
    }

      async function playAt(coords) {

        if (gameOver || !userId) return;

        const response = await fetch("/play4d", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: userId, coordOrder: coordOrder }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        render4dHexGrid(data.cells);
        if (data.player === 1){
          localPlayer = 1;
          document.getElementById("player").innerHTML = "Blue";
          const sidebar = document.querySelector(".sidebar");
          sidebar.style.setProperty("background-color", "#0f72e2");
        }
        else{
          localPlayer = -1;
          document.getElementById("player").innerHTML = "Red";
          const sidebar = document.querySelector(".sidebar");
          sidebar.style.setProperty("background-color", "#d20d0d");
        }

        if (data.victory) {
          gameOver = true;
          document.getElementById("winner").innerHTML = "Player " + (-data.player) + " has won!";
        }
      }

      async function mark(btn, coords){
        if (!marking) {return;}
        for (let i = 0; i < markedCoords.length; i++) {
            if (markedCoords[i][0] === coords[0] && markedCoords[i][1] === coords[1] && markedCoords[i][2] === coords[2] && markedCoords[i][3] === coords[3]) {
              markedCoords.splice(i, 1);
              localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
              const response = await fetch("/getBoard4d", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: userId, coordOrder: coordOrder, markedCoords: markedCoords }),
              });
            if (!response.ok) {
            document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
            return;
            }
            const data = await response.json();
            render4dHexGrid(data.board);
            return;
          }
        }
        markedCoords.push(coords);
        localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
        const response = await fetch("/getBoard4d", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: userId, coordOrder: coordOrder, markedCoords: markedCoords }),
              });
            if (!response.ok) {
            document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
            return;
            }
            const data = await response.json();
            render4dHexGrid(data.board);
            return;
          }

      function center(coords){
        subCenterX = centerX + (((coords[0] - coords[1]) * hexSize * .75) * (boardSize + 1.5))
        subCenterY = centerY + (((coords[0] + coords[1]) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
        x = subCenterX + ((coords[2] - coords[3]) * hexSize * .75)
        y = subCenterY + ((coords[2] + coords[3]) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
        return {
          x: x,
          y: y,
        }
      }
      
    async function createEdges(player) {
        const response = await fetch("/getEdges", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, coordOrder: coordOrder, player: player }),
        });
        if (!response.ok) {
          document.getElementById("error").innerHTML = "Server error: " + response.status;
          return;
        }
        c = document.getElementById("myCanvas");
        ctx = c.getContext("2d");


        const data = await response.json();
        data.edges.forEach(edge => {
            center1 = center(edge[0]);
            center2 = center(edge[1]);
            ctx.strokeStyle = player === 1 ? '#060359' : '#590303';
            ctx.beginPath();
            ctx.moveTo(center1.x, center1.y);
            ctx.lineTo(center2.x, center2.y);
            ctx.stroke();
        })
      }

      async function createTriangles(player) {
        const response = await fetch("/getTriangles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, coordOrder: coordOrder, player: player }),
        });
        if (!response.ok) {
          document.getElementById("error").innerHTML = "Server error: " + response.status;
          return;
        }
        const data = await response.json();
        data.triangles.forEach(triangle => {
            center1 = center(triangle[0]);
            center2 = center(triangle[1]);
            center3 = center(triangle[2]);
            ctx.beginPath();
            ctx.moveTo(center1.x, center1.y);
            ctx.lineTo(center2.x, center2.y);
            ctx.lineTo(center3.x, center3.y);
            ctx.closePath();
            ctx.fillStyle = player === 1 ? 'rgba(6, 3, 89, 0.2)' : 'rgba(89, 3, 3, 0.2)';
            ctx.fill();
            ctx.strokeStyle = player === 1 ? '#060359' : '#590303';
            ctx.stroke();
        })
      }

      function clearEdges() {
        render4dHexGrid(storedCells);
      }

      async function startGame(event) {
        event.preventDefault();
        clearMarking();

        if (marking){
            toggleMarking();
        }

        boardSize = Number(document.getElementById("size").value);

        gameOver = false;
        const response = await fetch("/start4dGame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, size: boardSize, coordOrder: coordOrder }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        userId = data.user_id;
        localStorage.setItem("userId", userId);
        render4dHexGrid(data.cells);
        document.getElementById("winner").innerHTML = "";
        document.getElementById("player").innerHTML = "Blue";
        localPlayer = 1;
        localStorage.setItem("localPlayer", localPlayer);
        const sidebar = document.querySelector(".sidebar");
        sidebar.style.setProperty("background-color", "#0f72e2");
        renderAxisButtons();
      }

      async function renderAdj(coords, add) {
        const response = await fetch("/renderAdj", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: userId }),
        }
        );
        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }
        const data = await response.json();
    adj = data.adj;
    adj.push(coords);

    c = document.getElementById("myCanvas");
    ctx = c.getContext("2d");

    for (let i = 0; i < adj.length; i++) {
        center = center(adj[i]);
        genHex(center.x, center.y, ctx);
        ctx.fillStyle = localPlayer === 1 ? 'rgba(6, 3, 89, 0.2)' : 'rgba(89, 3, 3, 0.2)';
        }
        
      }

      function getCenter(btn, wrapper) {
      const btnRect = btn.getBoundingClientRect();
      const wrapRect = wrapper.getBoundingClientRect();
      return {
        x: (btnRect.left + btnRect.width / 2) - wrapRect.left,
        y: (btnRect.top + btnRect.height / 2) - wrapRect.top,
    };
}

    function renderAxisButtons(){
        axisNames = ["U", "V", "X", "Y"]
        coordNames = []
        coordOrder.forEach(coord => {
            coordNames.push(axisNames[coord]);
        });
        for (let i = 0; i < 4; i++){
            document.getElementById("axis" + i).innerHTML = coordNames[i];
            for (let j = 0; j < 3; j++){
                let m = (i + j + 1) % 4;
                const axisChangeButton = document.createElement("button");
                axisChangeButton.textContent = "Change to " + axisNames[coordOrder[m]];
                axisChangeButton.onclick = () => changeAxis(i, m);
                document.getElementById("axisChange" + i + j).innerHTML = "";
                document.getElementById("axisChange" + i + j).appendChild(axisChangeButton);
            }
        }
    }


async function changeAxis(i, m){

    dummy = coordOrder[m];
    coordOrder[m] = coordOrder[i];
    coordOrder[i] = dummy;
    renderAxisButtons();

    markedCoords.forEach(coord => {
      dummy = coord[m];
      coord[m] = coord[i];
      coord[i] = dummy;
    });
    localStorage.setItem("markedCoords", JSON.stringify(markedCoords));

    localStorage.setItem("coordOrder", JSON.stringify(coordOrder));
    const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();
    render4dHexGrid(data.board);
}

async function recoverGame(){
    const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();
    render4dHexGrid(data.board);
    renderAxisButtons();
}

function drawTriangle(p1, p2, p3, player) {
  const edgeLayer = document.getElementById('edgeLayer');
  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  poly.setAttribute(
    'points',
    `${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`
  );
  poly.setAttribute('fill', player === 1 ? 'rgba(6, 3, 89, 0.2)' : 'rgba(89, 3, 3, 0.2)');
  poly.setAttribute('stroke', player === 1 ? '#060359' : '#590303');
  poly.setAttribute('stroke-width', '2');
  edgeLayer.appendChild(poly);
}

function toggleMarking() {
  marking = !marking;
  localStorage.setItem("marking", marking);
  if (marking) {
    document.getElementById("marking").innerHTML = "Marking";
  }
  else {
    document.getElementById("marking").innerHTML = "";
  }
}

async function clearMarking() {
  markedCoords = [];
  localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
  const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();
    render4dHexGrid(data.board);
  return;
}

async function newOrder(newOrder){
    oldOrder = coordOrder;
    coordOrder = newOrder;
    localStorage.setItem("coordOrder", JSON.stringify(coordOrder));
    const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();

    newMarkedCoords = [];
    for (let i = 0; i < markedCoords.length; i++) {
        newMarkedCoords.push([0,0,0,0]);
      for (let j = 0; j < 4; j++) {
        oldPos = oldOrder.indexOf(coordOrder[j]);
        newMarkedCoords[i][j] = markedCoords[i][oldPos];
      }
    }
    markedCoords = newMarkedCoords;
    localStorage.setItem("markedCoords", JSON.stringify(markedCoords));

    render4dHexGrid(data.board);
    renderAxisButtons();
}
    </script>
  </head>
