    <script>
      let userId = localStorage.getItem("userId");
      let coordOrder = JSON.parse(localStorage.getItem("coordOrder") || "[0,1,2,3]");
      let markedCoords = JSON.parse(localStorage.getItem("markedCoords") || "[]");
      let marking = JSON.parse(localStorage.getItem("marking") || "false");
      let gameOver = false;
      let localPlayer = 0;
      let boardSize = 0;
      let hexSize = 50;
      let centerX = 0;
      let centerY = 0;

    
    function render2dHexGrid(cells, baseX, baseY, ctx, axes) {

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < cells.length; i++) {
          for (let j = 0; j < cells[i].length; j++) {
            x = baseX + ((i - j) * hexSize * .75)
            y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
            drawHex(x, y, cells[i][j], ctx);
          }
        }


    }

    function findHex4d(mouseX, mouseY, ctxt){
        c = document.getElementById("myCanvas");
        ctx = c.getContext("2d");


      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
            baseX = centerX + (((i - j) * hexSize * .75) * (boardSize + 1.5))
            baseY = centerY + (((i + j) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
        ctx.beginPath();
        ctx.moveTo(baseX - (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX + (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.closePath();
          if (ctx.isPointInPath(mouseX, mouseY)) {
            coords = findHex2d(mouseX, mouseY, baseX, baseY, i, j, ctx);
            return coords;
          }
        }
      }
      return [];

    }

    function findHex2d(mouseX, mouseY, baseX, baseY, a, b, ctx){
    for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          x = baseX + ((i - j) * hexSize * .75)
          y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
        genHex(x, y, ctx);
          if (ctx.isPointInPath(mouseX, mouseY)) {
            return([a, b, i, j]);
          }
        }
      }
      return [];
    }

    function handleMouseDown(e){
      e.preventDefault();
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      coords = findHex4d(mouseX, mouseY, ctx);
      if (coords.length === 0) {return;}
      storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
      playAt(coords);
    }

    function handleMouseMove(e){
        e.preventDefault();

        if (gameOver){
          return;
        }

        currentHex = JSON.parse(localStorage.getItem("currentHex") || "[]");

        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;


        if (currentHex.length !== 0){
            center = Center(currentHex);
            x = center.x;
            y = center.y;
            genHex(x, y, ctx);
            if (ctx.isPointInPath(mouseX, mouseY)){
                return;
            }
        }
        
            coords = findHex4d(mouseX, mouseY, ctx);
            storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
            render4dHexGrid(storedCells, false);
            currentHex = coords;
            localStorage.setItem("currentHex", JSON.stringify(currentHex));
            if (coords.length === 0) {renderEdges();
                renderTriangles();
                return;}
            
            renderAdj(currentHex, true);
            renderEdges();
            renderTriangles();
            return;

    }

    // listen for mousedown events
    document.addEventListener("DOMContentLoaded", () => {
        const size = new URLSearchParams(window.location.search).get("size");
        document.getElementById("size").value = size;
        startGame();
        document.getElementById("myCanvas").addEventListener("mousedown", handleMouseDown);
        document.getElementById("myCanvas").addEventListener("mousemove", handleMouseMove);
    });



      function genHex(x, y, ctx) {
        ctx.beginPath();
        ctx.moveTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 2), y);
        ctx.lineTo(x + (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 2), y);
        ctx.lineTo(x - (hexSize / 4), y - (hexSize * .43));
        ctx.closePath();
      }



      function drawHex(x, y, player, ctx) {
        genHex(x, y, ctx);
        ctx.fillStyle = player === 1 ? "blue" : (player === -1 ? "red" : "#e8e8e8");
        ctx.fill();
        ctx.stroke();
      }

      function render4dHexGrid(cells, incOthers = true) {
        if (!cells){return;}
        localStorage.setItem("storedCells", JSON.stringify(cells));
        storedCells = cells;
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.strokeStyle = "black";

        axes = [0, 0, 0, 0];
        for (let i = 0; i < coordOrder.length; i++) {
            if (coordOrder[i] === 0 || coordOrder[i] === 2) {
                axes[i] = 1;
            }
            else {
                axes[i] = -1;
            }
        }

        ctx.clearRect(0, 0, c.width, c.height);

        centerX = c.width / 2;
        centerY = c.height / 2;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((boardSize + 1) * hexSize * .75), centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((boardSize + 1) * hexSize * .75), centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((boardSize + 1) * hexSize * .75), centerY - ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX + (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((boardSize + 1) * hexSize * .75), centerY + ((boardSize + .5) * (boardSize + 1) * hexSize * .43));
        ctx.lineTo(centerX - (boardSize * (boardSize + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? "blue" : "red";
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < cells.length; i++) {
          for (let j = 0; j < cells[i].length; j++) {
            x = centerX + (((i - j) * hexSize * .75) * (boardSize + 1.5))
            y = centerY + (((i + j) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
            render2dHexGrid(cells[i][j], x, y, ctx, axes);
          }
        }

        markedCoords = JSON.parse(localStorage.getItem("markedCoords") || "[]");
        markedCoords.forEach(coord => {
          center = Center(coord);
          if (storedCells[coord[0]][coord[1]][coord[2]][coord[3]] !== 0){
            ctx.beginPath();
            ctx.arc(center.x, center.y, hexSize / 4, 0, 2 * Math.PI);
            ctx.fillStyle = "yellow";
            ctx.fill();
          }
          else {
            genHex(center.x, center.y, ctx);
            ctx.fillStyle = "yellow";
            ctx.fill();
            ctx.stroke();
          }  
        });
        if (incOthers){
          renderTriangles();
          renderEdges();
        }
    }

      async function playAt(coords) {
        storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
        localStorage.setItem("triangles", JSON.stringify([]));
        localStorage.setItem("edges", JSON.stringify([]));

        if (marking){
          mark(coords);
          return;
        }
        if (storedCells[coords[0]][coords[1]][coords[2]][coords[3]] !== 0){
          return;
        }

        if (gameOver || !userId) return;

        const response = await fetch("/play4d", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: userId, coordOrder: coordOrder }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        render4dHexGrid(data.cells);
        if (data.player === 1){
          localPlayer = 1;
          document.getElementById("player").innerHTML = "Blue";
          const sidebar = document.querySelector(".sidebar");
          sidebar.style.setProperty("background-color", "#0f72e2");
        }
        else{
          localPlayer = -1;
          document.getElementById("player").innerHTML = "Red";
          const sidebar = document.querySelector(".sidebar");
          sidebar.style.setProperty("background-color", "#d20d0d");
        }

        if (data.victory) {
          gameOver = true;
          victory(-data.player);
        }
      }

      async function mark(coords){
        if (!marking) {return;}
        for (let i = 0; i < markedCoords.length; i++) {
            if (markedCoords[i][0] === coords[0] && markedCoords[i][1] === coords[1] && markedCoords[i][2] === coords[2] && markedCoords[i][3] === coords[3]) {
              markedCoords.splice(i, 1);
              localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
              const response = await fetch("/getBoard4d", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: userId, coordOrder: coordOrder}),
              });
            if (!response.ok) {
            document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
            return;
            }
            const data = await response.json();
            render4dHexGrid(data.board);
            return;
          }
        }
        markedCoords.push(coords);
        localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
        const response = await fetch("/getBoard4d", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ user_id: userId, coordOrder: coordOrder}),
              });
            if (!response.ok) {
            document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
            return;
            }
            const data = await response.json();
            render4dHexGrid(data.board);
            return;
          }

      function Center(coords){
        subCenterX = centerX + (((coords[0] - coords[1]) * hexSize * .75) * (boardSize + 1.5))
        subCenterY = centerY + (((coords[0] + coords[1]) * hexSize * .43) * (boardSize + 1)) - ((boardSize - 1) * (boardSize + 1) * hexSize * .43)
        x = subCenterX + ((coords[2] - coords[3]) * hexSize * .75)
        y = subCenterY + ((coords[2] + coords[3]) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
        return {
          x: x,
          y: y,
        }
      }
      
    async function createEdges(player) {
        const response = await fetch("/getEdges", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, coordOrder: coordOrder, player: player }),
        });
        if (!response.ok) {
          document.getElementById("error").innerHTML = "Server error: " + response.status;
          return;
        }
        c = document.getElementById("myCanvas");
        ctx = c.getContext("2d");


        const data = await response.json();
        localStorage.setItem("edges", JSON.stringify(data.edges));
        renderEdges();
      }

      function renderEdges() {
        ctx = document.getElementById("myCanvas").getContext("2d");
        edges = JSON.parse(localStorage.getItem("edges") || "[]");
        edges.forEach(edge => {
          center1 = Center(edge[0]);
          center2 = Center(edge[1]);
          ctx.beginPath();
          ctx.moveTo(center1.x, center1.y);
          ctx.lineTo(center2.x, center2.y);
          ctx.stroke();
        })
      }

      async function createTriangles(player) {
        const response = await fetch("/getTriangles", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, coordOrder: coordOrder, player: player }),
        });
        if (!response.ok) {
          document.getElementById("error").innerHTML = "Server error: " + response.status;
          return;
        }
        const data = await response.json();
        localStorage.setItem("triangles", JSON.stringify(data.triangles));
        renderTriangles();
      }

      function renderTriangles() {
        ctx = document.getElementById("myCanvas").getContext("2d");
        triangles = JSON.parse(localStorage.getItem("triangles") || "[]");
        triangles.forEach(triangle => {
          center1 = Center(triangle[0]);
          center2 = Center(triangle[1]);
          center3 = Center(triangle[2]);
          ctx.beginPath();
          ctx.moveTo(center1.x, center1.y);
          ctx.lineTo(center2.x, center2.y);
          ctx.lineTo(center3.x, center3.y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
          ctx.fill();
          ctx.strokeStyle = '#000000';
          ctx.stroke();
        })
      }

      function clearEdges() {
        localStorage.setItem("edges", JSON.stringify([]));
        localStorage.setItem("triangles", JSON.stringify([]));
        storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
        render4dHexGrid(storedCells);
      }

      async function startGame() {
        localStorage.setItem("storedCells", JSON.stringify([]));
        clearMarking();
        clearEdges();

        if (marking){
            toggleMarking();
        }

        boardSize = Number(document.getElementById("size").value);

        gameOver = false;
        const response = await fetch("/start4dGame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, size: boardSize, coordOrder: coordOrder }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        userId = data.user_id;
        localStorage.setItem("userId", userId);
        render4dHexGrid(data.cells);
        document.getElementById("winner").innerHTML = "";
        document.getElementById("player").innerHTML = "Blue";
        localPlayer = 1;
        localStorage.setItem("localPlayer", localPlayer);
        const sidebar = document.querySelector(".sidebar");
        sidebar.style.setProperty("background-color", "#0f72e2");
      }

      function adjInit(coords) {
        pos = adjBuild(coords, 0, 1);
        neg = adjBuild(coords, 0, -1);
        return pos.concat(neg);
      }

      function adjBuild(coords, start, sign) {
        if (start === 4){
            return [coords];
        }
        let unmod = adjBuild(coords, start + 1, sign);
        let newCoords = [0,0,0,0]
        for (let i = 0; i < coords.length; i++){
            if (i !== start){
                newCoords[i] = coords[i];
            }
            else {
                newCoords[i] = coords[i] + sign;
            }
        }
        if (newCoords[start] < 0 || newCoords[start] >= boardSize){
          return unmod;
        }
        let mod = adjBuild(newCoords, start + 1, sign);
        return unmod.concat(mod);
      }

      async function renderAdj(coords, add) {
        adj = adjInit(coords);

        let c = document.getElementById("myCanvas");
        let ctx = c.getContext("2d");

        if (!add) {
            let storedCells = JSON.parse(localStorage.getItem("storedCells") || "[]");
        }
        for (let i = 0; i < adj.length; i++) {
            let center = Center(adj[i]);
        ctx.beginPath();
        ctx.arc(center.x, center.y, hexSize / 4, 0, 2 * Math.PI);
        if (add) {
          ctx.fillStyle = localPlayer === 1 ? '#b1d2f9' : '#f9b8b1';
          ctx.fill();
        }
        else {
          playerHere = storedCells[adj[i][0]][adj[i][1]][adj[i][2]][adj[i][3]];
          if (playerHere === 0) {ctx.fillStyle = 'e8e8e8';}
          else {ctx.fillStyle = playerHere === 1 ? "blue" : playerHere === -1;}
          ctx.fill();
        }
      }
      }

async function changeAxis(i, m){
    localStorage.setItem("edges", JSON.stringify([]));
    localStorage.setItem("triangles", JSON.stringify([]));

    dummy = coordOrder[m];
    coordOrder[m] = coordOrder[i];
    coordOrder[i] = dummy;

    markedCoords.forEach(coord => {
      dummy = coord[m];
      coord[m] = coord[i];
      coord[i] = dummy;
    });
    localStorage.setItem("markedCoords", JSON.stringify(markedCoords));

    localStorage.setItem("coordOrder", JSON.stringify(coordOrder));
    const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();
    render4dHexGrid(data.board);
}

function toggleMarking() {
  marking = !marking;
  localStorage.setItem("marking", marking);
  if (marking) {
    document.getElementById("marking").innerHTML = "Marking";
  }
  else {
    document.getElementById("marking").innerHTML = "";
  }
}

async function clearMarking() {
  markedCoords = [];
  localStorage.setItem("markedCoords", JSON.stringify(markedCoords));
  const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();
    render4dHexGrid(data.board);
  return;
}

async function newOrder(choice){
    
    if (choice === 1){
        nextOrder = [0,2,1,3];
        document.getElementById("axisButton1").style.backgroundColor = "#ccc";
        document.getElementById("axisButton2").style.backgroundColor = "#eee";
        document.getElementById("axisButton3").style.backgroundColor = "#eee";
    }
    else if (choice === 2){
        nextOrder = [1,3,0,2];
        document.getElementById("axisButton1").style.backgroundColor = "#eee";
        document.getElementById("axisButton2").style.backgroundColor = "#ccc";
        document.getElementById("axisButton3").style.backgroundColor = "#eee";
    }
    else if (choice === 3){
        nextOrder = [1,2,3,0];
        document.getElementById("axisButton1").style.backgroundColor = "#eee";
        document.getElementById("axisButton2").style.backgroundColor = "#eee";
        document.getElementById("axisButton3").style.backgroundColor = "#ccc";
    } 


    localStorage.setItem("edges", JSON.stringify([]));
    localStorage.setItem("triangles", JSON.stringify([]));
    oldOrder = coordOrder;
    coordOrder = nextOrder;
    localStorage.setItem("coordOrder", JSON.stringify(coordOrder));
    const response = await fetch("/getBoard4d", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: userId, coordOrder: coordOrder }),
    });
    if (!response.ok) {
      document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
      return;
    }
    const data = await response.json();

    newMarkedCoords = [];
    for (let i = 0; i < markedCoords.length; i++) {
        newMarkedCoords.push([0,0,0,0]);
      for (let j = 0; j < 4; j++) {
        oldPos = oldOrder.indexOf(coordOrder[j]);
        newMarkedCoords[i][j] = markedCoords[i][oldPos];
      }
    }
    markedCoords = newMarkedCoords;
    localStorage.setItem("markedCoords", JSON.stringify(markedCoords));

    render4dHexGrid(data.board);
}

function victory(player){
  gameOver = true;
  c = document.getElementById("myCanvas");
  ctx = c.getContext("2d");
  ctx.fillStyle = player === 1 ? "blue" : "red";
  ctx.fillRect(centerX - 400, 0, 800, 140);
  ctx.font = "100px Arial";
  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (player === 1){
    ctx.fillText("Blue has won!", centerX, 70);
  }
  else {
    ctx.fillText("Red has won!", centerX, 70);
  }
}
    </script>
  </head>
  <body>

 <p>Player: <span id="player"></span></p>

        <input type="submit" value="Submit">

      <button onclick="toggleMarking()">Toggle Marking</button>
