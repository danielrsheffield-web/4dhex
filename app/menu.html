<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>4d Hex</title>
    <style>
    :root {
  --menu-bg: #565656;
  --menu-btn-bg: #e8e8e8;
  --menu-btn-hover: #d0d0d0;
  --menu-btn-text: #222;
  --menu-blue: #0f72e2;
  --menu-red: #d20d0d;
  --menu-radius: 6px;
}
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  width: 100%;
}
#container {
  height: 100vh;
  height: 100dvh;
  position: relative;
  width: 100%;
  padding: clamp(12px, 2vw, 24px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#myCanvas {
  position: absolute;
  inset: 0;
  display: block;
  height: 100%;
  width: 100%;
}
#overlay {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(320px, 100%);
  max-height: 100%;
  align-items: center;
  overflow-y: auto;
}
#controls {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  gap: 8px;
  width: min(220px, 100%);
}
#size-buttons {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 8px;
}
#playerPanel {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  position: absolute;
  display: flex;
  gap: clamp(4px, 1vw, 8px);
  width: min(500px, calc(100% - 24px));
  padding: 8px;
  align-items: center;
  visibility: hidden;
  background-color: #fff;
  border-radius: 6px;
  border: 2px solid #222;
  color: #000;
}
.playerPanel-btn, .main-btn, .size-btn {
  min-width: 0;
  min-height: 40px;
  padding: 8px;
  cursor: pointer;
  border-radius: 6px;
  border: 2px solid #222;
  background-color: #e8e8e8;
  color: #222;
  white-space: nowrap;
}
.playerPanel-btn {
  flex: 1;
  padding-inline: clamp(2px, 1vw, 8px);
  font-size: clamp(11px, 3.3vw, 14px);
}
.main-btn, .size-btn {
  width: 100%;
  font-size: 16px;
  font-weight: bold;
}
#title {
  flex-shrink: 0;
  width: 100%;
  padding: 4px 8px;
  font-size: clamp(40px, 10vw, 80px);
  line-height: 1.1;
  font-weight: bold;
  text-align: center;
  white-space: nowrap;
  background-color: #fff;
  border-radius: 6px;
  border: 2px solid #222;
  color: #000;
}
#controls form, #game-id-input {
  width: 100%;
  min-width: 0;
}
#game-id-input {
  padding: 8px;
  font-size: 16px;
}
@media (max-height: 500px) {
  #overlay, #controls {
    gap: 4px;
  }
  #title {
    font-size: clamp(32px, 10vh, 48px);
  }
  .main-btn, .size-btn {
    min-height: 32px;
    padding-block: 4px;
  }
}
    </style>
    <script>
        let hexSize = 50;
        let size = 3;
        let botResponse = false;
        let game_id = "";

        function setSize(newSize) {
            document.getElementById("size-btn-" + size).style.backgroundColor = "#e8e8e8";
            document.getElementById("size-btn-" + newSize).style.backgroundColor = "#ccc";
            size = newSize;
        }


        async function localGame() {
            const response = await fetch("/getId");
            const data = await response.json();
            const coordOrder = [0, 2, 1, 3];
            const response2 = await fetch("/start4dGame", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: data.user_id, size: size, coordOrder: coordOrder }),
            });
            const data2 = await response2.json();
            localStorage.setItem("cells", JSON.stringify(data2.cells));
            localStorage.setItem("markedCoords", JSON.stringify([]));
            window.location.href = "/playGame?size=" + size + "&game_id=" + data.user_id + "&player=0";
        }

        async function botGame() {
            const response = await fetch("/getId");
            const data = await response.json();
            const coordOrder = [0, 2, 1, 3];
            const response2 = await fetch("/start4dGame", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: data.user_id, size: size, coordOrder: coordOrder }),
            });
            const data2 = await response2.json();
            localStorage.setItem("cells", JSON.stringify(data2.cells));
            game_id = data.user_id;
            botResponse = true;
            document.getElementById("playerPanel").style.visibility = "visible";
        }





    function render4dHexGrid() {
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.strokeStyle = "black";

        axes = [1, -1, 1, -1];

        ctx.clearRect(0, 0, c.width, c.height);

        centerX = c.width / 2;
        centerY = c.height / 2;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((4 + 1) * hexSize * .75), centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((4 + 1) * hexSize * .75), centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((4 + 1) * hexSize * .75), centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((4 + 1) * hexSize * .75), centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < 4; j++) {
            x = centerX + (((i - j) * hexSize * .75) * (4 + 1.5))
            y = centerY + (((i + j) * hexSize * .43) * (4 + 1)) - ((4 - 1) * (4 + 1) * hexSize * .43)
            render2dHexGrid(x, y, ctx, axes);
          }
        }

        function render2dHexGrid(baseX, baseY, ctx, axes) {

            ctx.beginPath();
            ctx.moveTo(baseX, baseY);
            ctx.lineTo(baseX, baseY - ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX - (hexSize * .75), baseY - ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX - ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
            ctx.lineTo(baseX, baseY + ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX + (hexSize * .75), baseY + ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX + ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

            for (let i = 0; i < 4; i++) {
              for (let j = 0; j < 4; j++) {
                x = baseX + ((i - j) * hexSize * .75)
                y = baseY + ((i + j) * hexSize * .43) - ((4 - 1) * hexSize * .43)
                drawHex(x, y, ctx);
              }
            }
        }

    }

    function genHex(x, y, ctx) {
        ctx.beginPath();
        ctx.moveTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 2), y);
        ctx.lineTo(x + (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 2), y);
        ctx.lineTo(x - (hexSize / 4), y - (hexSize * .43));
        ctx.closePath();
      }



      function drawHex(x, y, ctx) {
        genHex(x, y, ctx);
        ctx.fillStyle = "#e8e8e8";
        ctx.fill();
        ctx.stroke();
      }

      function resizeCanvas() {
        const canvas = document.getElementById("myCanvas");
        const bounds = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.round(bounds.width));
        canvas.height = Math.max(1, Math.round(bounds.height));
        const padding = Math.min(24, Math.min(canvas.width, canvas.height) * 0.05);
        // The size-4 board, including its colored edges, spans these hex-size units.
        const boardWidth = 2 * 4 * (4 + 1.5) * 0.75;
        const boardHeight = 2 * (4 + 0.5) * (4 + 1) * 0.43;
        hexSize = Math.min(
          (canvas.width - 2 * padding) / boardWidth,
          (canvas.height - 2 * padding) / boardHeight
        );
        render4dHexGrid();
      }

      document.addEventListener("DOMContentLoaded", () => {
        resizeCanvas();
        new ResizeObserver(resizeCanvas).observe(document.getElementById("container"));
        document.getElementById("size-btn-3").style.backgroundColor = "#ccc";
    });

    async function onlineGame() {
        const response = await fetch("/getId");
        const data = await response.json();
        const coordOrder = [0, 2, 1, 3];
            const response2 = await fetch("/start4dGame", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: data.user_id, size: size, coordOrder: coordOrder }),
            });
            const data2 = await response2.json();
            localStorage.setItem("cells", JSON.stringify(data2.cells));
            document.getElementById("game-id-input").value = data.user_id;
            document.getElementById("playerPanel").style.visibility = "visible";
    }

    async function joinGame(player, event = null) {
        if (event) {
            event.preventDefault();
        }
        const game_id = String(document.getElementById("game-id-input").value);
        const response = await fetch("/joinGame", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: game_id, player: player }),
        });
        const data = await response.json();
        if (data.error) {
            alert(data.error);
            return;
        }
        localStorage.setItem("cells", JSON.stringify(data.cells));
        localStorage.setItem("markedCoords", JSON.stringify([]));
        window.location.href = "/playGame?size=" + data.cells.length + "&game_id=" + game_id + "&player=" + data.player + "&isHost=" + data.isHost;
    }

    function startJoin() {
        if (document.getElementById("game-id-input").style.visibility === "visible") {
            joinGame(0);
        }
        document.getElementById("game-id-input").style.visibility = "visible";
    }

    async function startTutorial() {
        const response = await fetch("/getId");
        const data = await response.json();
        localStorage.setItem("markedCoords", JSON.stringify([]));
        window.location.href = "/tutorial?game_id=" + data.user_id;
    }

    function continueStart(player) {
        if (botResponse) {
            if (player === 0) {
                player = Math.floor(Math.random() * 2) * 2 - 1;
            }
            localStorage.setItem("markedCoords", JSON.stringify([]));
            window.location.href = "/playGame?size=" + size + "&game_id=" + game_id + "&player=" + player + "&botResponse=true";
        }
        else {
            joinGame(player);
        }
    }
    </script>
  </head>
  <body>
      <div id = "container">
        <canvas id="myCanvas"></canvas>
        <div id = "overlay">
            <div id = "title">
                4d Hex
            </div>
        <div id = "controls">
            <div id = "size-buttons">
            <button class="size-btn" onclick="setSize(2)" id = "size-btn-2">2</button>
            <button class="size-btn" onclick="setSize(3)" id = "size-btn-3">3</button>
            <button class="size-btn" onclick="setSize(4)" id = "size-btn-4">4</button>
            <button class="size-btn" onclick="setSize(5)" id = "size-btn-5">5</button>
        </div>
            <button class="main-btn" onclick="startTutorial()">Tutorial</button>
            <button class="main-btn" onclick="localGame()">Local Game</button>
            <button class="main-btn" onclick="botGame()">Bot Game</button>
            <button class="main-btn" onclick="onlineGame()">Host Game</button>
            <button class="main-btn" onclick="startJoin()">Join Game</button>
            <form onsubmit="joinGame(0, event)">
                <input style="visibility: hidden;" type="text" name="game_id" placeholder="Game Code" id = "game-id-input" onkeydown="if(event.key === 'Enter'){joinGame(0, event)}">
            </form>
        </div>
        </div>
        <div id = "playerPanel">
            <button class="playerPanel-btn" onclick="continueStart(1)">Play First</button>
            <button class="playerPanel-btn" onclick="continueStart(-1)">Play Second</button>
            <button class="playerPanel-btn" onclick="continueStart(0)">Random</button>
        </div>
      </div>
  </body>
</html>
