<!DOCTYPE html>
<html>
  <head>
    <title>4d Hex</title>
    <style>
    :root {
  --menu-bg: #565656;
  --menu-btn-bg: #e8e8e8;

}
     #container
{
  height: 1000px;

}
#myCanvas
{
  height: 100%;
  width: 100%;
  max-height: 100%;
  max-width: 100%;
}
#overlay {
  bottom: 300px;

  display: flex;
  flex-direction: column;

  width: 320px;
  align-items: center;
}
#controls {
  display: flex;
  flex-direction: column;
  gap: 8px;           
  width: 200px;       
}
#playerPanel {
  bottom: 400px;
  left: 600px;
  position: absolute;
  display: flex;
  flex-direction: row;
  gap: 8px;           
  width: 500px;
  height: 120 px;    
  align-items: center;
  visibility: hidden;
  background-color: #fff;
    border-radius: 6px;
    border: 2px solid #222;
    color: #000
}
.playerPanel-btn {
  width: 100%;
  margin-bottom: 8px;
  margin-left: 8px;
  margin-right: 8px;
  margin-top: 8px;
  padding: 8px;
  cursor: pointer;
  border-radius: 6px;
  border: 2px solid #222;
  background-color: #e8e8e8;
  color: #222;
}
.main-btn {
    width: 100%;
    margin-bottom: 8px;
    padding: 8px;
    cursor: pointer;
    border-radius: 6px;
    border: 2px solid #222;
    background-color: #e8e8e8;
    color: #222;
    font-size: 16px;
    font-weight: bold;
}
.size-btn {
    width: 28.5%;
    padding: 8px;
    cursor: pointer;
    border-radius: 6px;
    border: 2px solid #222;
    background-color: #e8e8e8;
    color: #222;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
    margin-right: 7px;
}
#title {
    width: 320px;
    height: 100px;
    font-size: 96px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 16px;
    background-color: #fff;
    border-radius: 6px;
    border: 2px solid #222;
    color: #000

}
    </style>
    <script>
        const hexSize = 50;
        let size = 3;
        let botResponse = false;
        let game_id = "";

        function setSize(newSize) {
            document.getElementById("size-btn-" + size).style.backgroundColor = "#e8e8e8";
            document.getElementById("size-btn-" + newSize).style.backgroundColor = "#ccc";
            size = newSize;
        }


        async function localGame() {
            const response = await fetch("/getId");
            const data = await response.json();
            const coordOrder = [0, 2, 1, 3];
            const response2 = await fetch("/start4dGame", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: data.user_id, size: size, coordOrder: coordOrder }),
            });
            const data2 = await response2.json();
            localStorage.setItem("cells", JSON.stringify(data2.cells));
            window.location.href = "/playGame?size=" + size + "&game_id=" + data.user_id + "&player=0";
        }

        async function botGame() {
            const response = await fetch("/getId");
            const data = await response.json();
            const coordOrder = [0, 2, 1, 3];
            const response2 = await fetch("/start4dGame", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: data.user_id, size: size, coordOrder: coordOrder }),
            });
            const data2 = await response2.json();
            localStorage.setItem("cells", JSON.stringify(data2.cells));
            game_id = data.user_id;
            botResponse = true;
            document.getElementById("playerPanel").style.visibility = "visible";
        }





    function render4dHexGrid() {
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");
        ctx.strokeStyle = "black";

        axes = [1, -1, 1, -1];

        ctx.clearRect(0, 0, c.width, c.height);

        centerX = c.width / 2;
        centerY = c.height / 2;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((4 + 1) * hexSize * .75), centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((4 + 1) * hexSize * .75), centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[0] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + ((4 + 1) * hexSize * .75), centerY - ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX + (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX, centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - ((4 + 1) * hexSize * .75), centerY + ((4 + .5) * (4 + 1) * hexSize * .43));
        ctx.lineTo(centerX - (4 * (4 + 1.5) * hexSize * .75), centerY);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = axes[1] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < 4; i++) {
          for (let j = 0; j < 4; j++) {
            x = centerX + (((i - j) * hexSize * .75) * (4 + 1.5))
            y = centerY + (((i + j) * hexSize * .43) * (4 + 1)) - ((4 - 1) * (4 + 1) * hexSize * .43)
            render2dHexGrid(x, y, ctx, axes);
          }
        }

        function render2dHexGrid(baseX, baseY, ctx, axes) {

            ctx.beginPath();
            ctx.moveTo(baseX, baseY);
            ctx.lineTo(baseX, baseY - ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX - (hexSize * .75), baseY - ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX - ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
            ctx.lineTo(baseX, baseY + ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX + (hexSize * .75), baseY + ((4 + 1) * hexSize * .43));
            ctx.lineTo(baseX + ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[2] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((4 + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((4 + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = axes[3] === 1 ? '#1010c0' : '#d00000';
        ctx.fill();
        ctx.stroke();

            for (let i = 0; i < 4; i++) {
              for (let j = 0; j < 4; j++) {
                x = baseX + ((i - j) * hexSize * .75)
                y = baseY + ((i + j) * hexSize * .43) - ((4 - 1) * hexSize * .43)
                drawHex(x, y, ctx);
              }
            }
        }

    }

    function genHex(x, y, ctx) {
        ctx.beginPath();
        ctx.moveTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 2), y);
        ctx.lineTo(x + (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 2), y);
        ctx.lineTo(x - (hexSize / 4), y - (hexSize * .43));
        ctx.closePath();
      }



      function drawHex(x, y, ctx) {
        genHex(x, y, ctx);
        ctx.fillStyle = "#e8e8e8";
        ctx.fill();
        ctx.stroke();
      }

      document.addEventListener("DOMContentLoaded", () => {
        render4dHexGrid();
        document.getElementById("size-btn-3").style.backgroundColor = "#ccc";
    });

    async function onlineGame() {
        const response = await fetch("/getId");
        const data = await response.json();
        const coordOrder = [0, 2, 1, 3];
            const response2 = await fetch("/start4dGame", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: data.user_id, size: size, coordOrder: coordOrder }),
            });
            const data2 = await response2.json();
            localStorage.setItem("cells", JSON.stringify(data2.cells));
            document.getElementById("game-id-input").value = data.user_id;
            document.getElementById("playerPanel").style.visibility = "visible";
    }

    async function joinGame(player, event = null) {
        if (event) {
            event.preventDefault();
        }
        const game_id = String(document.getElementById("game-id-input").value);
        const response = await fetch("/joinGame", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: game_id, player: player }),
        });
        const data = await response.json();
        if (data.error) {
            alert(data.error);
            return;
        }
        localStorage.setItem("cells", JSON.stringify(data.cells));
        window.location.href = "/playGame?size=" + data.cells.length + "&game_id=" + game_id + "&player=" + data.player + "&isHost=" + data.isHost;
    }

    function startJoin() {
        if (document.getElementById("game-id-input").style.visibility === "visible") {
            joinGame(0);
        }
        document.getElementById("game-id-input").style.visibility = "visible";
    }

    async function startTutorial() {
        const response = await fetch("/getId");
        const data = await response.json();
        window.location.href = "/tutorial?game_id=" + data.user_id;
    }

    function continueStart(player) {
        if (botResponse) {
            if (player === 0) {
                player = Math.floor(Math.random() * 2) * 2 - 1;
            }
            window.location.href = "/playGame?size=" + size + "&game_id=" + game_id + "&player=" + player + "&botResponse=true";
        }
        else {
            joinGame(player);
        }
    }
    </script>
  </head>
  <body>
      <div id = "container">
        <canvas id="myCanvas" width="1700" height="1000"></canvas>
        <div id = "overlay">
            <div id = "title">
                4d Hex
            </div>
        <div id = "controls">
            <div id = "size-buttons">
            <button class="size-btn" onclick="setSize(2)" id = "size-btn-2">2</button>
            <button class="size-btn" onclick="setSize(3)" id = "size-btn-3">3</button>
            <button class="size-btn" onclick="setSize(4)" id = "size-btn-4">4</button>
        </div>
            <button class="main-btn" onclick="startTutorial()">Tutorial</button>
            <button class="main-btn" onclick="localGame()">Local Game</button>
            <button class="main-btn" onclick="botGame()">Bot Game</button>
            <button class="main-btn" onclick="onlineGame()">Host Game</button>
            <button class="main-btn" onclick="startJoin()">Join Game</button>
            <form onsubmit="joinGame(0, event)">
                <input style="visibility: hidden;" type="text" name="game_id" placeholder="Game Code" id = "game-id-input" style="font-size: 16px;" onkeydown="if(event.key === 'Enter'){joinGame(0, event)}">
            </form>
        </div>
        </div>
        <div id = "playerPanel">
            <button class="playerPanel-btn" onclick="continueStart(1)">Play First</button>
            <button class="playerPanel-btn" onclick="continueStart(-1)">Play Second</button>
            <button class="playerPanel-btn" onclick="continueStart(0)">Random</button>
        </div>
      </div>
  </body>
</html>
