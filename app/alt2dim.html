<!DOCTYPE html>
<html>
  <head>
    <title>Hex Game</title>
    <style>
        :root {
        --hex-size: 50px;
        }

      .hex-grid {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin: 4px 0;
      }
      .hex-row {
        display: flex;
        gap: 1px;
      }


      .hex-row + .hex-row {
          margin-top: -11px;   /* pull this row up — tune number */
    }

      .hex-btn {
        width: calc(var(--hex-size) * .933);
        height: var(--hex-size);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        color: #333;
      }

      .hex-btn:disabled {
        cursor: default;
      }
      .player-0 {
        background-color: #e8e8e8;
      }
      .player-1 {
        background-color: #0f72e2;
        color: white;
      }
      .player--1 {
        background-color: #d20d0d;
        color: white;
      }
      .hex-btn.highlight-1 {
        background-color: #b1d2f9;
        }
        .hex-btn.highlight--1 {
        background-color: #f9b8b1;
        }
    </style>
    <script>
      let userId = localStorage.getItem("userId");
      let gameOver = false;
      let buttonArray = [];
      let boardSize = 0;
      let hexSize = 50;
      let baseX = 400;
      let baseY = 400;

      function render2dHexGrid(cells) {
        var c = document.getElementById("myCanvas");
        var ctx = c.getContext("2d");

        ctx.clearRect(0, 0, c.width, c.height);

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = "blue";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = "blue";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - (hexSize * .75), baseY + ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX - ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX, baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + (hexSize * .75), baseY - ((boardSize + 1) * hexSize * .43));
        ctx.lineTo(baseX + ((boardSize + .5) * hexSize * .75), baseY);
        ctx.lineTo(baseX, baseY);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.stroke();

        for (let i = 0; i < cells.length; i++) {
          for (let j = 0; j < cells[i].length; j++) {
            x = baseX + ((i - j) * hexSize * .75)
            y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
            drawHex(x, y, cells[i][j], ctx);
          }
        }


    }

    function handleMouseDown(e){
      e.preventDefault();
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;
      console.log(mouseX, mouseY);

      for (let i = 0; i < boardSize; i++) {
        for (let j = 0; j < boardSize; j++) {
          x = baseX + ((i - j) * hexSize * .75)
          y = baseY + ((i + j) * hexSize * .43) - ((boardSize - 1) * hexSize * .43)
          ctx.beginPath();
        ctx.moveTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 2), y);
        ctx.lineTo(x + (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 2), y);
        ctx.lineTo(x - (hexSize / 4), y - (hexSize * .43));
        ctx.closePath();
          if (ctx.isPointInPath(mouseX, mouseY)) {
            playAt([i, j]);
            return;
          }
        }
      }
      

    }

    // listen for mousedown events
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("myCanvas").addEventListener("mousedown", handleMouseDown);
    });







      function drawHex(x, y, player, ctx) {
        ctx.beginPath();
        ctx.moveTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 2), y);
        ctx.lineTo(x + (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 4), y + (hexSize * .43));
        ctx.lineTo(x - (hexSize / 2), y);
        ctx.lineTo(x - (hexSize / 4), y - (hexSize * .43));
        ctx.lineTo(x + (hexSize / 4), y - (hexSize * .43));
        ctx.closePath();
        ctx.fillStyle = player === 1 ? "blue" : (player === -1 ? "red" : "#e8e8e8");
        ctx.fill();
        ctx.stroke();
      }

      async function playAt(coords) {
        if (gameOver || !userId) return;

        const response = await fetch("/play2d", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: userId }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        render2dHexGrid(data.cells);
        document.getElementById("player").innerHTML = data.player;

        if (data.victory) {
          gameOver = true;
          document.getElementById("winner").innerHTML = "Player " + (-data.player) + " has won!";
          render2dHexGrid(data.cells);
        }
      }

      async function startGame(event) {
        event.preventDefault();

        boardSize = Number(document.getElementById("size").value);
        
        gameOver = false;
        const response = await fetch("/start2dGame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, size: boardSize }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        userId = data.user_id;
        localStorage.setItem("userId", userId);
        render2dHexGrid(data.cells);
        document.getElementById("winner").innerHTML = "";
        document.getElementById("player").innerHTML = data.player;
      }

      async function renderAdj(coords, add) {
        const response = await fetch("/renderAdj", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: userId }),
        }
        );
        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }
        const data = await response.json();
    adj = data.adj;
    adj.push(coords);
    for (let i = 0; i < adj.length; i++) {
        adjCoord = adj[i];
        subspace = buttonArray;
        for (let j = 0; j < adjCoord.length; j++) {
            subspace = subspace[adjCoord[j]];
        }
        if (!subspace.classList.contains("player-1") && !subspace.classList.contains("player--1")){
            if(add){
                subspace.classList.add("highlight-" + (data.player));
            }
            else{
                subspace.classList.remove("highlight-" + (data.player));
            }
        }

    }
        
      }
    </script>
  </head>
  <body>
    <p>Player: <span id="player"></span></p>
    <span id="error"></span>

    <canvas id="myCanvas" width="800" height="800"></canvas>
    <p><span id="winner"></span></p>
  
  <form onsubmit = "startGame(event)">
    <label for="size">Size:</label>
    <input type="text" id="size" name="size" size="4">
    <input type="submit" value="Submit">
  </form>
    </body>
</html>
