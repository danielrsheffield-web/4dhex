<!DOCTYPE html>
<html>
  <head>
    <title>Hex Game</title>
    <style>

      :root {
        --hex-size: 50px;
        --board-hex-size: 4;
        --board-size: calc(var(--hex-size) * var(--board-hex-size) * 1.4);
        }

      .hex-grid-container {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin: 4px 0;
      }

      .hex-grid-row{
        display: flex;
        gap: 1px;
      }

      .hex-grid {
        display: flex;
        flex-direction: column;
        gap: 0;
        margin: 4px 0;
      }
      .hex-row {
        display: flex;
        gap: 1px;
      }


      .hex-row + .hex-row {
          margin-top: -11px;   /* pull this row up — tune number */
    }

      .hex-btn {
        width: calc(var(--hex-size) * .9333);
        height: var(--hex-size);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        border: none;
        cursor: pointer;
        font-size: 24px;
        font-weight: bold;
        color: #333;
      }

      .hex-btn:disabled {
        cursor: default;
      }
      .player-0 {
        background-color: #e8e8e8;
      }
      .player-1 {
        background-color: #0f72e2;
        color: white;
      }
      .player--1 {
        background-color: #d20d0d;
        color: white;
      }
      .hex-btn.highlight-1 {
        background-color: #b1d2f9;
        }
        .hex-btn.highlight--1 {
        background-color: #f9b8b1;
        }
        .hex-btn.player-1.highlight-1 {
        color: #b1d2f9;
        }
        .hex-btn.player--1.highlight--1 {
        color: #f9b8b1;
        }
        .hex-btn.player-1.highlight-1 {
        color: #b1d2f9;
        }
        .hex-btn.player--1.highlight--1 {
        color: #f9b8b1;
        }
    </style>
    <script>
      let userId = localStorage.getItem("userId");
      let gameOver = false;
      let buttonArray = [];

      function render4dHexGrid(cells) {
        buttonArray = [];
        const grid = document.getElementById("hexGrid");
        grid.innerHTML = "";
        grid.className = "hex-grid-container";
        m = cells.length - 1;
        cells.forEach((megaFace, m) => {
            const megaFaceButtonArray = [];
            buttonArray.push(megaFaceButtonArray);
            const megaFaceDiv = document.createElement("div");
            megaFaceDiv.className = "hex-grid-row";
            megaFaceDiv.style.marginLeft = (cells.length - 1 - m) * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--board-size')) * .5 + "px";
            megaFace.forEach((face, f) => {
                faceButtonArray = [];
                megaFaceButtonArray.push(faceButtonArray);
                const faceDiv = document.createElement("div");
                faceDiv.className = "hex-grid";
            face.forEach((row, r) => {
              const rowButtonArray = [];
              faceButtonArray.push(rowButtonArray);
              const rowDiv = document.createElement("div");
              rowDiv.className = "hex-row";
              rowDiv.style.marginLeft = (cells.length - 1 - r) * parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hex-size')) * .5 + "px";
              row.forEach((player, c) => {
                const btn = document.createElement("button");
                btn.className = "hex-btn player-" + player;
                btn.textContent = player === 0 ? "" : (player === 1 ? "1" : "-");
                btn.disabled = gameOver || player !== 0;
                btn.onclick = () => playAt([m, f, r, c]);
                btn.onmouseenter = () => renderAdj([m, f, r, c], true);
                btn.onmouseleave = () => renderAdj([m, f, r, c], false);
                rowButtonArray.push(btn);
                rowDiv.appendChild(btn);
              });
              faceDiv.appendChild(rowDiv);
            });
              megaFaceDiv.appendChild(faceDiv);
            });
            grid.appendChild(megaFaceDiv);
          });
      }

      async function playAt(coords) {
        if (gameOver || !userId) return;

        const response = await fetch("/play4d", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: userId }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        render4dHexGrid(data.cells);
        document.getElementById("player").innerHTML = data.player;

        if (data.victory) {
          gameOver = true;
          document.getElementById("winner").innerHTML = "Player " + (-data.player) + " has won!";
        }
      }

      async function startGame(event) {
        event.preventDefault();
        
        gameOver = false;
        const response = await fetch("/start4dGame", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, size: document.getElementById("size").value }),
        });

        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }

        const data = await response.json();
        userId = data.user_id;
        localStorage.setItem("userId", userId);
        render4dHexGrid(data.cells);
        document.getElementById("winner").innerHTML = "";
        document.getElementById("player").innerHTML = data.player;
      }

      async function renderAdj(coords, add) {
        const response = await fetch("/renderAdj", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ coords: coords, user_id: userId }),
        }
        );
        if (!response.ok) {
          document.getElementById("hexGrid").innerHTML = "Server error: " + response.status;
          return;
        }
        const data = await response.json();
    adj = data.adj;
    adj.push(coords);
    for (let i = 0; i < adj.length; i++) {
        adjCoord = adj[i];
        subspace = buttonArray;
        for (let j = 0; j < adjCoord.length; j++) {
            subspace = subspace[adjCoord[j]];
        }
        if (subspace.classList.contains("player-1")){
            if(add){
                subspace.classList.add("player-1.highlight-" + (data.player));
            }
            else{
                subspace.classList.remove("player-1.highlight-" + (data.player));
            }
        }
        elseif (subspace.classList.contains("player--1")){
            if(add){
                subspace.classList.add("player--1.highlight-" + (data.player));
            }
            else{
                subspace.classList.remove("player--1.highlight-" + (data.player));
            }
        }
        else{
            if(add){
                subspace.classList.add("highlight-" + (data.player));
            }
            else{
                subspace.classList.remove("highlight-" + (data.player));
            }
        }


    }
        
      }
    </script>
  </head>
  <body>
    <p>Player: <span id="player"></span></p>

    <div id="hexGrid" class="hex-grid"></div>
    <p><span id="winner"></span></p>
  
  <form onsubmit = "startGame(event)">
    <label for="fname">Size:</label>
    <input type="text" id="size" name="size" size="4">
    <input type="submit" value="Submit">
  </form>
    </body>
</html>
